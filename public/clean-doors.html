<!DOCTYPE html>
<html>
<head><title>Clean Doors</title></head>
<body>
  <h2>Cleaning doors image...</h2>
  <div id="status">Starting...</div>
  <canvas id="c"></canvas>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    async function cleanDoors() {
      const img = new Image();
      img.src = '/doors-pristine.jpg';
      await new Promise(r => img.onload = r);

      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      // The tiny purple marker is around x=885, y=575 (in normalized terms: x ~ 0.885 * width, y ~ 0.575 * height)
      // Let's find its exact location:
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      let minX = 9999, maxX = 0, minY = 9999, maxY = 0;
      let found = false;

      for (let y = Math.floor(canvas.height * 0.5); y < Math.floor(canvas.height * 0.65); y++) {
        for (let x = Math.floor(canvas.width * 0.8); x < Math.floor(canvas.width * 0.95); x++) {
          const idx = (y * canvas.width + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          // Check for purple / magenta mark (high red & blue, low green)
          if (r > 100 && b > 80 && g < 50) {
            found = true;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      if (found) {
        status.textContent = `Found purple mark at ${minX},${minY} to ${maxX},${maxY}. Patching...`;
        // Patch with texture from 30px to the left
        ctx.drawImage(canvas, minX - 35, minY - 10, (maxX - minX) + 20, (maxY - minY) + 20, minX - 10, minY - 10, (maxX - minX) + 20, (maxY - minY) + 20);
      } else {
        status.textContent = 'No purple mark detected, saving clean image...';
      }

      const dataUrl = canvas.toDataURL('image/jpeg', 0.96);
      await fetch('/api/save-frame', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'doors-pristine-clean.jpg', dataUrl })
      });

      status.textContent = 'DOORS_CLEAN_SAVED';
    }

    cleanDoors();
  </script>
</body>
</html>
