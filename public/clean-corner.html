<!DOCTYPE html>
<html>
<head><title>Clean Corner</title></head>
<body>
  <h2>Cleaning Floral Corner...</h2>
  <div id="status">Starting...</div>
  <canvas id="c"></canvas>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    async function process() {
      try {
        const img = new Image();
        img.src = '/floral-corner.jpg';
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });

        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        const w = canvas.width;
        const h = canvas.height;

        const daisyCenters = [
          [330, 125], [550, 240], [300, 480], [380, 520], [220, 590], [180, 310]
        ];

        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const p = (y * w + x) * 4;
            const r = d[p], g = d[p + 1], b = d[p + 2];

            // 1. Green leaves / stems
            const isGreen = (g > r + 5 && g > b + 3) || (g > 55 && g > r && g - b > 3) || (g > 70 && r < 140 && b < 130);
            // 2. Pink / peach roses & buds
            const isPink = (r > g + 13 && r > b + 6) || (r > 150 && g < 135);
            // 3. Yellow flower centers
            const isYellow = (r > 165 && g > 120 && b < 100);
            // 4. Dark stems / deep shadows under flowers
            const isDark = (r < 112 && g < 112 && b < 108);
            // 5. White roses
            const isWhiteRose1 = (x >= 100 && x <= 295 && y >= 320 && y <= 490);
            const isWhiteRose2 = (x >= 355 && x <= 505 && y >= 115 && y <= 265);
            // 6. Daisy petals
            let isDaisy = false;
            for (const [dx, dy] of daisyCenters) {
              if (Math.hypot(x - dx, y - dy) < 38) {
                isDaisy = true;
                break;
              }
            }

            const isForeground = isGreen || isPink || isYellow || isDark || isWhiteRose1 || isWhiteRose2 || isDaisy;

            if (!isForeground) {
              d[p + 3] = 0; // transparent!
            }
          }
        }

        // Clean up outer edges and blank zones
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const p = (y * w + x) * 4;
            const r = d[p], g = d[p+1], b = d[p+2];
            const isGreen = (g > r + 5 && g > b + 3);
            const isPink = (r > g + 13 && r > b + 6);
            if ((x > 890 && y > 300) || (y > 930 && x > 260) || (x + y > 1180)) {
              d[p + 3] = 0;
            } else if ((x < 55 || y < 55 || x > 950 || y > 950) && !isGreen && !isPink) {
              d[p + 3] = 0;
            }
          }
        }

        // Connected component speck removal (< 1200 pixels)
        const labelVisited = new Uint8Array(w * h);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = y * w + x;
            if (d[idx * 4 + 3] > 0 && !labelVisited[idx]) {
              const compQueue = [idx];
              labelVisited[idx] = 1;
              let compHead = 0;
              while (compHead < compQueue.length) {
                const cIdx = compQueue[compHead++];
                const cx = cIdx % w;
                const cy = Math.floor(cIdx / w);

                const neighbors = [
                  cx > 0 ? cy * w + (cx - 1) : -1,
                  cx < w - 1 ? cy * w + (cx + 1) : -1,
                  cy > 0 ? (cy - 1) * w + cx : -1,
                  cy < h - 1 ? (cy + 1) * w + cx : -1,
                ];

                for (const n of neighbors) {
                  if (n >= 0 && !labelVisited[n] && d[n * 4 + 3] > 0) {
                    labelVisited[n] = 1;
                    compQueue.push(n);
                  }
                }
              }

              if (compQueue.length < 1200) {
                for (const cIdx of compQueue) {
                  d[cIdx * 4 + 3] = 0;
                }
              }
            }
          }
        }

        // Feather edges
        for (let pass = 0; pass < 2; pass++) {
          for (let y = 1; y < h - 1; y++) {
            for (let x = 1; x < w - 1; x++) {
              const idx = (y * w + x) * 4;
              if (d[idx + 3] > 0) {
                let transCount = 0;
                if (d[((y-1)*w + x)*4 + 3] === 0) transCount++;
                if (d[((y+1)*w + x)*4 + 3] === 0) transCount++;
                if (d[(y*w + x-1)*4 + 3] === 0) transCount++;
                if (d[(y*w + x+1)*4 + 3] === 0) transCount++;

                if (transCount >= 2) {
                  d[idx + 3] = Math.min(d[idx + 3], 150);
                } else if (transCount === 1) {
                  d[idx + 3] = Math.min(d[idx + 3], 215);
                }
              }
            }
          }
        }

        // Crop bounding box
        let minX = w, maxX = 0, minY = h, maxY = 0;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const idx = (y * w + x) * 4;
            if (d[idx + 3] > 20) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        minX = Math.max(0, minX - 4);
        minY = Math.max(0, minY - 4);
        maxX = Math.min(w, maxX + 4);
        maxY = Math.min(h, maxY + 4);

        const cropW = maxX - minX;
        const cropH = maxY - minY;

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = cropW;
        cropCanvas.height = cropH;
        const cropCtx = cropCanvas.getContext('2d');

        ctx.putImageData(imgData, 0, 0);
        cropCtx.drawImage(canvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);

        const dataUrl = cropCanvas.toDataURL('image/png');
        await fetch('/api/save-frame', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'floral-corner-clean.png', dataUrl })
        });

        status.textContent = 'DONE: ' + cropW + 'x' + cropH;
      } catch (err) {
        status.textContent = 'ERROR: ' + err.message;
        console.error(err);
      }
    }

    process();
  </script>
</body>
</html>
