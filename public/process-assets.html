<!DOCTYPE html>
<html>
<head><title>Process Assets</title></head>
<body>
  <h2>Processing Invitation Assets...</h2>
  <div id="status">Starting...</div>
  <canvas id="c"></canvas>

  <script>
    const status = document.getElementById('status');
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    async function process() {
      try {
        // 1. Process Plaque -> plaque-clean.png
        status.textContent = 'Processing plaque...';
        await processPlaque();

        status.textContent = 'ALL_ASSETS_PROCESSED_SUCCESSFULLY';
      } catch (e) {
        status.textContent = 'ERROR: ' + e.message;
        console.error(e);
      }
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function saveImage(name, dataUrl) {
      await fetch('/api/save-frame', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, dataUrl })
      });
    }

    async function processPlaque() {
      const img = await loadImage('/plaque.jpg');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      const w = canvas.width;
      const h = canvas.height;

      // Sample corner background color
      const bgR = d[0], bgG = d[1], bgB = d[2];

      // BFS flood fill from 4 corners and borders
      const visited = new Uint8Array(w * h);
      const queue = [];

      function pushPixel(x, y) {
        if (x >= 0 && x < w && y >= 0 && y < h) {
          const idx = y * w + x;
          if (!visited[idx]) {
            visited[idx] = 1;
            queue.push(idx);
          }
        }
      }

      // Add all outer border pixels
      for (let x = 0; x < w; x++) {
        pushPixel(x, 0);
        pushPixel(x, h - 1);
      }
      for (let y = 0; y < h; y++) {
        pushPixel(0, y);
        pushPixel(w - 1, y);
      }

      let head = 0;
      while (head < queue.length) {
        const idx = queue[head++];
        const x = idx % w;
        const y = Math.floor(idx / w);
        const p = idx * 4;
        const r = d[p], g = d[p + 1], b = d[p + 2];

        // Is this pixel part of the dark green background?
        // Background has r < 115, and color difference from bg is small
        const diff = Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB);
        const isGold = (r > 135 && g > 115 && r > b + 25) || (r > 180 && g > 160);
        const isWhiteOrCream = r > 180 && g > 180 && b > 160;

        if (!isGold && !isWhiteOrCream && (diff < 90 || (r < 110 && g < 125 && b < 105))) {
          d[p + 3] = 0; // Transparent
          // Expand to neighbors
          pushPixel(x + 1, y);
          pushPixel(x - 1, y);
          pushPixel(x, y + 1);
          pushPixel(x, y - 1);
        }
      }

      // Smooth alpha boundary
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = (y * w + x) * 4;
          if (d[idx + 3] > 0) {
            // Count transparent neighbors
            let transparentNeighbors = 0;
            if (d[((y-1)*w + x)*4 + 3] === 0) transparentNeighbors++;
            if (d[((y+1)*w + x)*4 + 3] === 0) transparentNeighbors++;
            if (d[(y*w + x-1)*4 + 3] === 0) transparentNeighbors++;
            if (d[(y*w + x+1)*4 + 3] === 0) transparentNeighbors++;

            if (transparentNeighbors >= 2) {
              d[idx + 3] = 160;
            } else if (transparentNeighbors === 1) {
              d[idx + 3] = 210;
            }
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
      const dataUrl = canvas.toDataURL('image/png');
      await saveImage('plaque-clean.png', dataUrl);
    }

    process();
  </script>
</body>
</html>
