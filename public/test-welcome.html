<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Section Patrika Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Eczar:wght@500;600;700;800&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Rozha+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/index.css">
  <link rel="stylesheet" href="/src/App.css">
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }
    .preview-container {
      width: 100%;
      max-width: 500px;
      background-color: var(--color-bg);
      position: relative;
    }
    .patrika-card {
      padding: 3.8rem 2rem 5.6rem !important;
      max-width: 410px !important;
    }
    .patrika-kalash-icon {
      width: 36px !important;
      height: 36px !important;
      margin-top: 0.2rem !important;
      margin-bottom: 3px !important;
    }
    .patrika-shloka-text {
      font-size: 1.02rem !important;
      margin: 1px 0 2px !important;
    }
    .patrika-vivah-badge {
      font-size: 1.12rem !important;
      margin: 1px 0 4px !important;
    }
    .patrika-divider {
      margin: 0.2rem 0 !important;
    }
    .patrika-divider svg {
      width: 190px !important;
      height: 16px !important;
    }
    .patrika-title {
      font-size: 0.72rem !important;
      letter-spacing: 3.5px !important;
      margin: 0.15rem 0 0.2rem !important;
    }
    .welcome-text-intro {
      font-size: 1.04rem !important;
      line-height: 1.45 !important;
      margin: 0.1rem 0 !important;
    }
    .patrika-couple-names {
      font-family: 'Great Vibes', cursive !important;
      font-size: 2.1rem !important;
      font-weight: 500 !important;
      color: #1A261D !important;
      margin: 0.1rem 0 0.15rem !important;
      line-height: 1.1 !important;
    }
    .welcome-text-blessing {
      font-size: 1.02rem !important;
      line-height: 1.55 !important;
      max-width: 270px !important;
      margin: 0.1rem 0 0.2rem !important;
    }
    .patrika-footer {
      margin-top: 0.1rem !important;
      margin-bottom: 0 !important;
    }
    .patrika-blessing-header {
      font-size: 0.98rem !important;
      margin-bottom: 2px !important;
    }
    .patrika-family-names {
      font-size: 0.74rem !important;
      margin-bottom: 1px !important;
    }
    .patrika-family-sub {
      font-size: 0.62rem !important;
    }
  </style>
</head>
<body>
  <div class="preview-container">
    <section class="welcome-section" id="welcome">
      <div class="patrika-watermark-disc" aria-hidden="true"></div>

      <div class="patrika-card">
        <div class="patrika-card-inner">
          <div class="patrika-card-shimmer" aria-hidden="true"></div>

          <!-- Top Auspicious Invocation Header -->
          <div class="patrika-header">
            <svg
              width="48"
              height="48"
              viewBox="0 0 100 100"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              class="patrika-kalash-icon"
              aria-label="Auspicious Mangal Kalash"
            >
              <defs>
                <linearGradient id="patrikaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FFF4C2" />
                  <stop offset="25%" stop-color="#E2BD63" />
                  <stop offset="50%" stop-color="#AA7C11" />
                  <stop offset="75%" stop-color="#F5D77F" />
                  <stop offset="100%" stop-color="#8F6416" />
                </linearGradient>
                <linearGradient id="patrikaGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#D4AF37" />
                  <stop offset="100%" stop-color="#7A5615" />
                </linearGradient>
                <radialGradient id="kalashGlowGrad" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.32" />
                  <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
                </radialGradient>
              </defs>

              <circle cx="50" cy="50" r="46" fill="url(#kalashGlowGrad)" />

              <path d="M50 36 C47 22, 49 12, 50 5 C51 12, 53 22, 50 36 Z" fill="url(#patrikaGoldGrad)" stroke="#7A5615" stroke-width="0.8" />
              <path d="M45 40 C30 32, 20 22, 16 14 C26 17, 36 27, 45 40 Z" fill="url(#patrikaGoldGrad)" stroke="#7A5615" stroke-width="0.8" />
              <path d="M55 40 C70 32, 80 22, 84 14 C74 17, 64 27, 55 40 Z" fill="url(#patrikaGoldGrad)" stroke="#7A5615" stroke-width="0.8" />
              <path d="M42 45 C22 42, 12 34, 8 26 C18 29, 30 38, 42 45 Z" fill="url(#patrikaGoldGrad)" stroke="#7A5615" stroke-width="0.8" />
              <path d="M58 45 C78 42, 88 34, 92 26 C82 29, 70 38, 58 45 Z" fill="url(#patrikaGoldGrad)" stroke="#7A5615" stroke-width="0.8" />

              <path d="M40 44 C36 30, 42 17, 50 15 C58 17, 64 30, 60 44 Z" fill="url(#patrikaGoldGrad)" stroke="#6E4A0C" stroke-width="1" />
              <path d="M42 30 Q50 34 58 30" stroke="#8C1D13" stroke-width="1.6" stroke-linecap="round" />
              <path d="M43 24 Q50 28 57 24" stroke="#8C1D13" stroke-width="1.4" stroke-linecap="round" />

              <ellipse cx="50" cy="45" rx="18" ry="4.5" fill="url(#patrikaGoldGrad)" stroke="#6E4A0C" stroke-width="1" />
              <path d="M34 45 L31 52 L69 52 L66 45 Z" fill="url(#patrikaGoldDark)" stroke="#6E4A0C" stroke-width="0.8" />

              <path d="M31 52 C21 60, 23 74, 36 82 L64 82 C77 74, 79 60, 69 52 Z" fill="url(#patrikaGoldGrad)" stroke="#6E4A0C" stroke-width="1.2" />

              <path d="M28 62 Q50 67 72 62" stroke="#6E4A0C" stroke-width="0.9" fill="none" />
              <path d="M29 66 Q50 71 71 66" stroke="#6E4A0C" stroke-width="0.9" fill="none" />

              <g stroke="#8C1D13" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M50 58 L50 74" />
                <path d="M42 66 L58 66" />
                <path d="M50 58 L56 58" />
                <path d="M58 66 L58 72" />
                <path d="M50 74 L44 74" />
                <path d="M42 66 L42 60" />
              </g>
              <circle cx="45" cy="62" r="1" fill="#8C1D13" />
              <circle cx="55" cy="62" r="1" fill="#8C1D13" />
              <circle cx="45" cy="70" r="1" fill="#8C1D13" />
              <circle cx="55" cy="70" r="1" fill="#8C1D13" />

              <path d="M36 82 Q50 86 64 82 L67 87 Q50 91 33 87 Z" fill="url(#patrikaGoldGrad)" stroke="#6E4A0C" stroke-width="1" />
            </svg>
            <p class="patrika-shloka-text">॥ श्री गणेशाय नमः ॥</p>
            <div class="patrika-vivah-badge">
              <span class="patrika-badge-dot">•</span>
              <span class="patrika-badge-text">शुभ विवाह</span>
              <span class="patrika-badge-dot">•</span>
            </div>
          </div>

          <div class="patrika-divider" aria-hidden="true">
            <svg width="220" height="20" viewBox="0 0 220 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="pGoldLine" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#C5A059" stop-opacity="0.05" />
                  <stop offset="35%" stop-color="#D4AF37" stop-opacity="0.85" />
                  <stop offset="50%" stop-color="#FFF2B2" stop-opacity="1" />
                  <stop offset="65%" stop-color="#D4AF37" stop-opacity="0.85" />
                  <stop offset="100%" stop-color="#C5A059" stop-opacity="0.05" />
                </linearGradient>
              </defs>
              <path d="M12 10 L82 10" stroke="url(#pGoldLine)" stroke-width="1.2" stroke-linecap="round" />
              <path d="M138 10 L208 10" stroke="url(#pGoldLine)" stroke-width="1.2" stroke-linecap="round" />
              <circle cx="12" cy="10" r="2" fill="#D4AF37" />
              <circle cx="208" cy="10" r="2" fill="#D4AF37" />
              <g transform="translate(110, 10)">
                <path d="M0 -7 C3 -2, 5 0, 8 0 C5 3, 2 5, 0 8 C-2 5, -5 3, -8 0 C-5 0, -3 -2, 0 -7 Z" fill="url(#patrikaGoldGrad)" />
                <circle cx="0" cy="0" r="2" fill="#8C1D13" />
                <path d="M-8 0 C-14 -4, -18 0, -22 -2" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" fill="none" />
                <path d="M8 0 C14 -4, 18 0, 22 -2" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" fill="none" />
              </g>
            </svg>
          </div>

          <!-- Content -->
          <div class="patrika-content">
            <h3 class="patrika-title">WEDDING INVITATION</h3>
            <p class="welcome-text-intro">
              We are honored to welcome you to the<br />Wedding ceremony of
            </p>
            <div class="patrika-couple-names">Rohit &amp; Priya</div>
            <p class="welcome-text-blessing">
              As they begin their sacred journey together in faith and love,<br />
              we thank you from the bottom of our hearts for being part of this blessed occasion <span class="inline-heart"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span>
            </p>
          </div>

          <div class="patrika-divider" aria-hidden="true">
            <svg width="220" height="20" viewBox="0 0 220 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 10 L82 10" stroke="url(#pGoldLine)" stroke-width="1.2" stroke-linecap="round" />
              <path d="M138 10 L208 10" stroke="url(#pGoldLine)" stroke-width="1.2" stroke-linecap="round" />
              <circle cx="12" cy="10" r="2" fill="#D4AF37" />
              <circle cx="208" cy="10" r="2" fill="#D4AF37" />
              <g transform="translate(110, 10)">
                <path d="M0 -7 C3 -2, 5 0, 8 0 C5 3, 2 5, 0 8 C-2 5, -5 3, -8 0 C-5 0, -3 -2, 0 -7 Z" fill="url(#patrikaGoldGrad)" />
                <circle cx="0" cy="0" r="2" fill="#8C1D13" />
                <path d="M-8 0 C-14 -4, -18 0, -22 -2" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" fill="none" />
                <path d="M8 0 C14 -4, 18 0, 22 -2" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" fill="none" />
              </g>
            </svg>
          </div>

          <!-- Footer -->
          <div class="patrika-footer">
            <p class="patrika-blessing-header">॥ स्नेह निमंत्रण ॥</p>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
