<!DOCTYPE html>
<html>
<head><title>Extract Audio</title></head>
<body>
  <h2>Checking audio from source-video.mp4...</h2>
  <div id="status">Loading video...</div>
  <script>
    async function extractAudio() {
      const status = document.getElementById('status');
      try {
        const response = await fetch('/source-video.mp4');
        const arrayBuffer = await response.arrayBuffer();
        status.textContent = 'Video fetched (' + arrayBuffer.byteLength + ' bytes), decoding audio...';

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        
        status.textContent = 'Audio decoded! Channels: ' + audioBuffer.numberOfChannels + ', Duration: ' + audioBuffer.duration.toFixed(1) + 's. Converting to WAV...';

        // Convert audioBuffer to 16-bit PCM WAV
        const wavData = audioBufferToWav(audioBuffer);
        const blob = new Blob([wavData], { type: 'audio/wav' });
        const reader = new FileReader();
        reader.onload = async () => {
          const dataUrl = reader.result;
          status.textContent = 'Saving audio.wav (' + dataUrl.length + ' chars)...';
          await fetch('/api/save-frame', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: 'wedding-music.wav', dataUrl })
          });
          status.textContent = 'AUDIO_SAVED_SUCCESSFULLY';
        };
        reader.readAsDataURL(blob);

      } catch (err) {
        status.textContent = 'AUDIO_ERROR: ' + err.message;
        console.error(err);
      }
    }

    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1; // PCM
      const bitDepth = 16;
      
      const bytesPerSample = bitDepth / 8;
      const blockAlign = numChannels * bytesPerSample;
      
      // We can take up to 60 seconds to keep size reasonable
      const maxSamples = Math.min(buffer.length, sampleRate * 60);
      const dataSize = maxSamples * blockAlign;
      const headerSize = 44;
      const totalSize = headerSize + dataSize;
      
      const arrayBuffer = new ArrayBuffer(totalSize);
      const view = new DataView(arrayBuffer);
      
      function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }
      
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(36, 'data');
      view.setUint32(40, dataSize, true);
      
      const channels = [];
      for (let i = 0; i < numChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }
      
      let offset = 44;
      for (let i = 0; i < maxSamples; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          let sample = Math.max(-1, Math.min(1, channels[ch][i]));
          sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
          view.setInt16(offset, sample, true);
          offset += 2;
        }
      }
      
      return arrayBuffer;
    }

    extractAudio();
  </script>
</body>
</html>
