<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="You are cordially invited to the wedding celebration of Rohit & Priyanshi" />
  <title>Rohit & Priyanshi — Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Rozha+One&display=swap"
    rel="stylesheet">
  <link rel="preload" as="image" href="./royal-door-only.jpg" />
  <link rel="preload" as="image" href="./celebrate-couple.webp" type="image/webp" />
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);
  </script>
</head>

<body>
  <div id="root">
    <!-- Instant Fallback Royal Preloader (seamlessly replaced when React mounts) -->
    <div style="position:fixed;inset:0;background:radial-gradient(circle at center,#260a14 0%,#17050d 50%,#0d0207 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFF1B0;font-family:Georgia,serif;text-align:center;padding:20px;z-index:9999;user-select:none;">
      <div style="font-size:1.15rem;letter-spacing:0.18em;color:#F8E29E;margin-bottom:18px;text-shadow:0 0 14px rgba(229,189,88,0.5);">
        ॥ श्री महावीराय नमः ॥
      </div>
      <div style="width:84px;height:84px;border-radius:50%;border:2px solid #DFB247;background:#240711;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px rgba(223,178,71,0.25);margin-bottom:18px;">
        <span style="font-family:'Great Vibes',cursive;font-size:1.85rem;color:#FFF3C4;">R <span style="color:#D93848;">♥</span> P</span>
      </div>
      <h1 style="font-family:'Alex Brush','Great Vibes',cursive;font-size:2.2rem;font-weight:normal;color:#FFF3C4;margin:0 0 4px 0;line-height:1.2;">Rohit &amp; Priyanshi</h1>
      <p style="font-family:'Cinzel',serif;font-size:0.75rem;letter-spacing:0.25em;text-transform:uppercase;color:#D6BD8A;margin:0 0 24px 0;opacity:0.85;">Wedding Celebration</p>
      <div style="width:200px;height:4px;background:rgba(45,12,22,0.8);border:1px solid rgba(223,178,71,0.35);border-radius:4px;overflow:hidden;position:relative;">
        <div style="width:100%;height:100%;background:linear-gradient(90deg,#A87A1B,#E2BC57,#FFF6D5,#E2BC57);border-radius:3px;animation:preloaderPulse 1.5s ease-in-out infinite;"></div>
      </div>
      <p style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:0.85rem;color:#E2CCA6;margin-top:12px;letter-spacing:0.04em;">Preparing Royal Invitation...</p>
      <style>
        @keyframes preloaderPulse {
          0% { opacity: 0.5; transform: scaleX(0.4); transform-origin: left; }
          50% { opacity: 1; transform: scaleX(1); transform-origin: left; }
          100% { opacity: 0.5; transform: scaleX(0.4); transform-origin: right; }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
